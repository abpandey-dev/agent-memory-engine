[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-engine"
version = "0.1.0"
description = "Long-term memory for AI agents: LLM fact extraction, add/update decisions with history, hybrid graph + keyword recall, an MCP server and a benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhishek Pandey" }]
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.6",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memory = "agent_memory.cli:main"
memory-mcp = "agent_memory.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
