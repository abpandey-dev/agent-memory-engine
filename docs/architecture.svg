<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E56CF"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="28" font-weight="700" fill="#0F172A">Agent Memory Engine</text>
  <text x="40" y="80" font-size="15" fill="#475569">Long-term memory for AI agents: remembers across conversations, keeps history, knows when it doesn't know</text>

  <!-- WRITE PATH lane -->
  <rect x="24" y="104" width="1152" height="250" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="44" y="132" font-size="13" font-weight="700" fill="#1D4ED8" letter-spacing="1">WRITE PATH · after each conversation · 2 Claude calls</text>

  <rect x="44" y="160" width="170" height="160" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="129" y="196" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Conversation</text>
  <text x="129" y="226" font-size="12" fill="#475569" text-anchor="middle">"We finally moved</text>
  <text x="129" y="244" font-size="12" fill="#475569" text-anchor="middle">to Berlin last week"</text>
  <text x="129" y="274" font-size="12" fill="#475569" text-anchor="middle">"Diego just started</text>
  <text x="129" y="292" font-size="12" fill="#475569" text-anchor="middle">as a veterinarian"</text>

  <rect x="260" y="160" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="280" y="190" font-size="15" font-weight="700" fill="#1D4ED8">① Extract</text>
  <text x="400" y="190" font-size="11" fill="#D97757" font-weight="700">CLAUDE</text>
  <text x="280" y="216" font-size="12" fill="#334155">Standalone memories, third person</text>
  <text x="280" y="236" font-size="12" fill="#334155">+ keywords (dog → pet, puppy)</text>
  <text x="280" y="256" font-size="12" fill="#334155">+ people, pets, places</text>
  <text x="280" y="276" font-size="12" fill="#334155">Sees KNOWN people, so a bare</text>
  <text x="280" y="296" font-size="12" fill="#334155">"Diego" becomes "her husband"</text>

  <rect x="556" y="160" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="576" y="190" font-size="15" font-weight="700" fill="#1D4ED8">② Decide</text>
  <text x="690" y="190" font-size="11" fill="#D97757" font-weight="700">CLAUDE</text>
  <text x="576" y="216" font-size="12" fill="#334155">Compare with related memories:</text>
  <rect x="576" y="228" width="58" height="22" rx="5" fill="#DCFCE7"/><text x="605" y="244" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">ADD</text>
  <rect x="640" y="228" width="74" height="22" rx="5" fill="#FEF3C7"/><text x="677" y="244" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">UPDATE</text>
  <rect x="720" y="228" width="58" height="22" rx="5" fill="#F1F5F9"/><text x="749" y="244" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SKIP</text>
  <text x="576" y="276" font-size="12" fill="#334155">UPDATE keeps the old fact as</text>
  <text x="576" y="296" font-size="12" fill="#334155">history: "Izmir, until 6 July"</text>

  <rect x="852" y="150" width="304" height="380" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="872" y="180" font-size="15" font-weight="700" fill="#0F766E">③ Memory store</text>
  <text x="1010" y="180" font-size="11" fill="#64748B">SQLite</text>
  <rect x="872" y="196" width="264" height="30" rx="6" fill="#F0FDFA"/>
  <text x="884" y="216" font-size="12" fill="#134E4A">m-0013 Moved to Berlin</text>
  <text x="1068" y="216" font-size="11" fill="#15803D">current</text>
  <rect x="872" y="232" width="264" height="30" rx="6" fill="#F8FAFC"/>
  <text x="884" y="252" font-size="12" fill="#94A3B8" text-decoration="line-through">m-0003 Based in Izmir</text>
  <text x="1068" y="252" font-size="11" fill="#B45309">history</text>
  <rect x="872" y="268" width="264" height="30" rx="6" fill="#F0FDFA"/>
  <text x="884" y="288" font-size="12" fill="#134E4A">m-0011 Husband Diego is a vet</text>
  <text x="872" y="326" font-size="12" font-weight="700" fill="#0F766E">Entity graph</text>
  <circle cx="930" cy="400" r="30" fill="#CCFBF1" stroke="#0F766E"/><text x="930" y="405" font-size="12" text-anchor="middle" fill="#134E4A">User</text>
  <circle cx="1060" cy="360" r="30" fill="#CCFBF1" stroke="#0F766E"/><text x="1060" y="365" font-size="12" text-anchor="middle" fill="#134E4A">Diego</text>
  <circle cx="1070" cy="460" r="30" fill="#CCFBF1" stroke="#0F766E"/><text x="1070" y="465" font-size="12" text-anchor="middle" fill="#134E4A">Berlin</text>
  <circle cx="950" cy="490" r="26" fill="#CCFBF1" stroke="#0F766E"/><text x="950" y="495" font-size="12" text-anchor="middle" fill="#134E4A">Luna</text>
  <line x1="958" y1="390" x2="1031" y2="368" stroke="#0F766E"/>
  <line x1="958" y1="412" x2="1042" y2="452" stroke="#0F766E"/>
  <line x1="936" y1="429" x2="945" y2="464" stroke="#0F766E"/>
  <text x="986" y="370" font-size="10" fill="#475569">husband</text>
  <text x="1012" y="426" font-size="10" fill="#475569" text-anchor="middle">lives in</text>
  <text x="934" y="450" font-size="10" fill="#475569" text-anchor="end">pet</text>

  <line x1="214" y1="240" x2="256" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="240" x2="552" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="806" y1="240" x2="848" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- READ PATH lane -->
  <rect x="24" y="374" width="806" height="196" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="44" y="402" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="1">READ PATH · when a question comes in · 1 Claude call</text>

  <rect x="44" y="424" width="170" height="124" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="129" y="458" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Question</text>
  <text x="129" y="488" font-size="12" fill="#475569" text-anchor="middle">"What does my</text>
  <text x="129" y="506" font-size="12" fill="#475569" text-anchor="middle">husband do</text>
  <text x="129" y="524" font-size="12" fill="#475569" text-anchor="middle">for work?"</text>

  <rect x="260" y="424" width="250" height="124" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="280" y="454" font-size="15" font-weight="700" fill="#6D28D9">④ Recall</text>
  <text x="392" y="454" font-size="11" fill="#15803D" font-weight="700">NO LLM · ~1 ms</text>
  <text x="280" y="480" font-size="12" fill="#334155">BM25 over memories + keywords</text>
  <text x="280" y="500" font-size="12" fill="#334155">+ one hop through the graph</text>
  <text x="280" y="520" font-size="12" fill="#334155">current facts rank above history</text>
  <text x="280" y="538" font-size="12" fill="#334155">top 8 memories</text>

  <rect x="556" y="424" width="250" height="124" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="576" y="454" font-size="15" font-weight="700" fill="#6D28D9">⑤ Answer</text>
  <text x="680" y="454" font-size="11" fill="#D97757" font-weight="700">CLAUDE</text>
  <text x="576" y="480" font-size="12" fill="#334155">Uses only recalled memories</text>
  <text x="576" y="500" font-size="12" fill="#334155">Cites memory ids</text>
  <text x="576" y="520" font-size="12" fill="#334155">known=false → "I don't know"</text>
  <text x="576" y="538" font-size="12" fill="#334155">(never invents a sister's name)</text>

  <line x1="214" y1="486" x2="256" y2="486" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="486" x2="552" y2="486" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M852,430 C800,410 560,405 440,420" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="650" y="396" font-size="11" fill="#0F766E">reads memories</text>

  <!-- MCP lane -->
  <rect x="24" y="594" width="1152" height="182" rx="14" fill="#FAF5FF" stroke="#E9D5FF"/>
  <text x="44" y="622" font-size="13" font-weight="700" fill="#6E56CF" letter-spacing="1">MCP SERVER · plug the memory into any agent</text>

  <rect x="44" y="642" width="220" height="112" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="154" y="676" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Claude Code</text>
  <text x="154" y="700" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Claude Desktop</text>
  <text x="154" y="724" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">any MCP agent</text>

  <line x1="264" y1="698" x2="326" y2="698" stroke="#6E56CF" stroke-width="2" marker-start="url(#arrowp)" marker-end="url(#arrowp)"/>
  <text x="295" y="688" font-size="11" fill="#6E56CF" text-anchor="middle">stdio</text>

  <rect x="330" y="642" width="826" height="112" rx="10" fill="#FFFFFF" stroke="#6E56CF" stroke-width="2"/>
  <text x="350" y="672" font-size="14" font-weight="700" fill="#6E56CF">memory-mcp</text>
  <text x="350" y="694" font-size="12" fill="#475569">claude mcp add memory -- memory-mcp</text>
  <g font-size="13" font-weight="600">
    <rect x="350" y="708" width="120" height="30" rx="15" fill="#EDE9FE"/><text x="410" y="728" text-anchor="middle" fill="#5B21B6">remember</text>
    <rect x="480" y="708" width="100" height="30" rx="15" fill="#EDE9FE"/><text x="530" y="728" text-anchor="middle" fill="#5B21B6">recall</text>
    <rect x="590" y="708" width="140" height="30" rx="15" fill="#EDE9FE"/><text x="660" y="728" text-anchor="middle" fill="#5B21B6">list_memories</text>
    <rect x="740" y="708" width="130" height="30" rx="15" fill="#EDE9FE"/><text x="805" y="728" text-anchor="middle" fill="#5B21B6">list_entities</text>
    <rect x="880" y="708" width="96" height="30" rx="15" fill="#FEE2E2"/><text x="928" y="728" text-anchor="middle" fill="#B91C1C">forget</text>
  </g>
  <text x="992" y="720" font-size="11" fill="#475569">GDPR right to</text>
  <text x="992" y="736" font-size="11" fill="#475569">erasure: hard delete</text>
</svg>
